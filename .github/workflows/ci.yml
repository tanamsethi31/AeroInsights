name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit lands on the same branch — keeps
# the queue tight and stops PRs from racing against themselves.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Each gate runs as its own step so the GitHub UI shows the failing
      # stage without you having to dig through logs. All four must pass
      # for the workflow to succeed.

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (eslint — react-hooks rules)
        run: npm run lint

      - name: Test (vitest + smoke)
        run: npm test

      - name: Build (vite)
        run: npm run build
