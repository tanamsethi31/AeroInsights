<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="X-UA-Compatible" content="IE=Edge"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aeroinsights</title>

  <!-- Inter font — matches the Aeroinsights design system -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!--
    Office.js must be loaded from the CDN — not from npm.
    It must appear BEFORE any other scripts and is synchronous by design.
  -->
  <script
    src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"
    type="text/javascript">
  </script>

  <!--
    Shared runtime: functions.js is loaded here so that custom function
    registration (CustomFunctions.associate) runs in the same JavaScript
    context as the task pane. This is required when lifetime="long" is set
    in the manifest <Runtimes> element.
  -->
  <script src="/functions/functions.js" type="text/javascript"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #FFFFFF;
      color: #0F172A;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- React app bundle injected by Vite -->
  <script type="module" src="./main.tsx"></script>
</body>
</html>
