<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="X-UA-Compatible" content="IE=Edge"/>
  <title>Aeroinsights — Sign In</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
    rel="stylesheet"
  />
  <script
    src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"
    type="text/javascript">
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #F8FAFC; margin: 0;
    }
    .card {
      background: #fff; border: 1px solid #E2E8F0; border-radius: 12px;
      padding: 32px; text-align: center; max-width: 340px;
    }
    .logo { font-size: 20px; font-weight: 800; color: #002147; margin-bottom: 8px; }
    .subtitle { font-size: 13px; color: #64748B; margin-bottom: 24px; }
    .status { font-size: 12px; color: #475569; }
    .error { color: #DC2626; font-size: 12px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Aeroinsights</div>
    <div class="subtitle">Connecting to Auth0…</div>
    <div class="status" id="status">Redirecting to sign-in…</div>
    <div class="error" id="error"></div>
  </div>

  <!--
    auth-dialog.ts is the Vite TypeScript entry for this page.
    It handles both the initial Auth0 redirect and the callback (code exchange).
  -->
  <script type="module" src="./auth-dialog.ts"></script>
</body>
</html>
