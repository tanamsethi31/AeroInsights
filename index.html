
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Aeroinsights — Aircraft Portfolio Stress Testing & Market Intelligence</title>

      <!-- SEO / search-engine description -->
      <meta name="description" content="Aeroinsights is an IFRS 9 credit-loss and stress-testing platform for aircraft lessors — Stage 1/2/3 ECL, 12 macro scenarios, 10,000-path Monte Carlo, jurisdiction risk and an AI portfolio assistant." />

      <!-- Canonical -->
      <link rel="canonical" href="https://aeroinsights.vercel.app/" />

      <!-- Open Graph (Facebook, LinkedIn, WhatsApp, Slack, iMessage) -->
      <meta property="og:type"        content="website" />
      <meta property="og:site_name"   content="Aeroinsights" />
      <meta property="og:title"       content="Aeroinsights — Aircraft Portfolio Stress Testing & Market Intelligence" />
      <meta property="og:description" content="IFRS 9 ECL, 12 macro stress scenarios with Monte Carlo, jurisdiction risk and an AI portfolio assistant for aircraft lessors." />
      <meta property="og:url"         content="https://aeroinsights.vercel.app/" />
      <meta property="og:image"       content="https://aeroinsights.vercel.app/og-image.png" />
      <meta property="og:image:width"  content="1200" />
      <meta property="og:image:height" content="630" />
      <meta property="og:image:alt"   content="Aeroinsights — portfolio stress testing and market intelligence for aircraft lessors" />
      <meta property="og:locale"      content="en_IE" />

      <!-- Twitter / X large-image card -->
      <meta name="twitter:card"        content="summary_large_image" />
      <meta name="twitter:title"       content="Aeroinsights — Aircraft Portfolio Stress Testing & Market Intelligence" />
      <meta name="twitter:description" content="IFRS 9 ECL, 12 macro stress scenarios with Monte Carlo, jurisdiction risk and an AI portfolio assistant." />
      <meta name="twitter:image"       content="https://aeroinsights.vercel.app/og-image.png" />
      <meta name="twitter:image:alt"   content="Aeroinsights — portfolio stress testing for aircraft lessors" />

      <!-- Schema.org JSON-LD — richer search results + AI-citation surface -->
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Aeroinsights",
        "url": "https://aeroinsights.vercel.app/",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "description": "IFRS 9 credit-loss and stress-testing platform for aircraft lessors — Stage 1/2/3 ECL, 12 pre-calibrated macro scenarios with 10,000-path Monte Carlo, jurisdiction and Cape Town Convention risk, and an AI portfolio assistant.",
        "image": "https://aeroinsights.vercel.app/og-image.png",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
      }
      </script>

      <!-- Favicons — explicit sizes so mobile Chrome and Safari pick the
           right asset instead of downscaling a multi-megapixel PNG.
           Apple touch icon at 180x180 per Apple's spec; web manifest
           provides the Android Chrome + PWA icons. -->
      <link rel="icon" type="image/png" sizes="16x16"   href="/favicon-16.png" />
      <link rel="icon" type="image/png" sizes="32x32"   href="/favicon-32.png" />
      <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
      <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
      <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
      <link rel="manifest" href="/site.webmanifest" />
      <meta name="theme-color" content="#002147" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
